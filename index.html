<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Keshriya Sarees</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}
body{
    background:linear-gradient(135deg,#5d001e,#8b1e3f,#d4af37);
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}
.card{
    width:340px;
    background:#fff;
    border-radius:20px;
    padding:30px;
    text-align:center;
    box-shadow:0 10px 25px rgba(0,0,0,.3);
}
.logo{
    width:220px;
    margin-bottom:15px;
}
h1{
    color:#8b1e3f;
    margin-bottom:8px;
}
p{
    color:#555;
    margin-bottom:25px;
}
.btn{
    display:block;
    text-decoration:none;
    color:#fff;
    padding:15px;
    margin:15px 0;
    border-radius:12px;
    font-size:18px;
    font-weight:bold;
    transition:.3s;
}
.instagram{
    background:#d62976;
}
.whatsapp{
    background:#25D366;
}
.btn:hover{
    transform:scale(1.05);
}
.footer{
    margin-top:20px;
    color:#777;
    font-size:14px;
}
</style>

</head>

<body>

<div class="card">

<img src="logo.png" class="logo" alt="Keshriya Logo">

<h1>Keshriya Sarees</h1>

<p>Traditional Elegance • Premium Collection</p>

<a class="btn instagram"
href="https://www.instagram.com/keshriya_sarees"
target="_blank">

</a>

<a class="btn whatsapp"
href="https://wa.me/919251030310"
target="_blank">

</a>

</div>

</html>
